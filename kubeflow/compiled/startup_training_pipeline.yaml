# PIPELINE DEFINITION
# Name: startup-acquisition-training
# Description: Validate, clean, feature engineer, train, evaluate, and quality gate the startup acquisition classifier.
# Inputs:
#    age_from_year_columns: list [Default: ['founding_year']]
#    allowed_target_values: list [Default: ['Acquired', 'Independent']]
#    approval_metric: str [Default: 'f1_weighted']
#    class_weight: str [Default: 'balanced']
#    cleaning_date_columns: list [Default: []]
#    drop_columns: list [Default: ['company_id']]
#    drop_duplicate_rows: bool [Default: True]
#    drop_empty_rows: bool [Default: True]
#    fail_on_duplicate_rows: bool [Default: False]
#    feature_date_columns: list [Default: []]
#    keep_date_columns: bool [Default: False]
#    log_columns: list [Default: ['total_funding_usd_millions', 'valuation_usd_millions', 'revenue_arr_millions']]
#    max_iter: int [Default: 2000.0]
#    max_missing_fraction: float [Default: 1.0]
#    minimum_approval_metric: float [Default: 0.7]
#    missing_markers: list [Default: ['', 'n/a', 'null', 'none', 'nan']]
#    model_type: str [Default: 'logistic_regression']
#    n_estimators: int [Default: 300.0]
#    numeric_columns: list [Default: ['founding_year', 'total_funding_usd_millions', 'valuation_usd_millions', 'revenue_arr_millions', 'monthly_burn_rate_millions', 'runway_months_2024', 'peak_headcount_2023', 'layoffs_2024_2025', 'current_headcount_2026']]
#    output_format: str [Default: 'parquet']
#    random_state: int [Default: 42.0]
#    ratio_features: list [Default: ['funding_per_employee=total_funding_usd_millions/current_headcount_2026', 'valuation_to_revenue=valuation_usd_millions/revenue_arr_millions']]
#    reference_year: int [Default: 2026.0]
#    required_columns: list [Default: ['company_id', 'domain', 'founding_year', 'country', 'city', 'funding_stage', 'total_funding_usd_millions', 'valuation_usd_millions', 'revenue_arr_millions', 'monthly_burn_rate_millions', 'runway_months_2024', 'peak_headcount_2023', 'layoffs_2024_2025', 'current_headcount_2026', 'investor_tier', 'ai_adoption_level']]
#    source_dataset_uri: str
#    source_format: str [Default: 'csv']
#    stratify: bool [Default: True]
#    target_column: str [Default: 'acquisition_status']
#    test_fraction: float [Default: 0.15]
#    train_fraction: float [Default: 0.7]
#    validation_fraction: float [Default: 0.15]
# Outputs:
#    approval_decision: system.Artifact
#    candidate_model: system.Model
#    evaluation_metrics: system.Metrics
#    manifest: system.Artifact
components:
  comp-build-feature-splits:
    executorLabel: exec-build-feature-splits
    inputDefinitions:
      artifacts:
        cleaned_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        age_from_year_columns:
          parameterType: LIST
        date_columns:
          parameterType: LIST
        drop_columns:
          parameterType: LIST
        input_format:
          parameterType: STRING
        keep_date_columns:
          parameterType: BOOLEAN
        log_columns:
          parameterType: LIST
        output_format:
          parameterType: STRING
        random_state:
          parameterType: NUMBER_INTEGER
        ratio_features:
          parameterType: LIST
        reference_year:
          parameterType: NUMBER_INTEGER
        stratify:
          parameterType: BOOLEAN
        target_column:
          parameterType: STRING
        test_fraction:
          parameterType: NUMBER_DOUBLE
        train_fraction:
          parameterType: NUMBER_DOUBLE
        validation_fraction:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        feature_metadata:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        validation_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        test_rows:
          parameterType: NUMBER_INTEGER
        train_rows:
          parameterType: NUMBER_INTEGER
        validation_rows:
          parameterType: NUMBER_INTEGER
  comp-clean-dataset:
    executorLabel: exec-clean-dataset
    inputDefinitions:
      artifacts:
        input_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        date_columns:
          parameterType: LIST
        drop_duplicate_rows:
          parameterType: BOOLEAN
        drop_empty_rows:
          parameterType: BOOLEAN
        input_format:
          parameterType: STRING
        missing_markers:
          parameterType: LIST
        numeric_columns:
          parameterType: LIST
        output_format:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        cleaned_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        cleaning_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        input_rows:
          parameterType: NUMBER_INTEGER
        output_rows:
          parameterType: NUMBER_INTEGER
  comp-condition-2:
    dag:
      outputs:
        artifacts:
          pipelinechannel--quality-gate-approval_decision:
            artifactSelectors:
            - outputArtifactKey: approval_decision
              producerSubtask: quality-gate
      tasks:
        quality-gate:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-quality-gate
          inputs:
            parameters:
              metric_name:
                componentInputParameter: pipelinechannel--approval_metric
              metric_value:
                componentInputParameter: pipelinechannel--evaluate-classifier-test_accuracy
              minimum_value:
                componentInputParameter: pipelinechannel--minimum_approval_metric
          taskInfo:
            name: quality-gate
    inputDefinitions:
      parameters:
        pipelinechannel--approval_metric:
          parameterType: STRING
        pipelinechannel--evaluate-classifier-test_accuracy:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--minimum_approval_metric:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        pipelinechannel--quality-gate-approval_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-condition-3:
    dag:
      outputs:
        artifacts:
          pipelinechannel--quality-gate-2-approval_decision:
            artifactSelectors:
            - outputArtifactKey: approval_decision
              producerSubtask: quality-gate-2
      tasks:
        quality-gate-2:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-quality-gate-2
          inputs:
            parameters:
              metric_name:
                componentInputParameter: pipelinechannel--approval_metric
              metric_value:
                componentInputParameter: pipelinechannel--evaluate-classifier-test_balanced_accuracy
              minimum_value:
                componentInputParameter: pipelinechannel--minimum_approval_metric
          taskInfo:
            name: quality-gate-2
    inputDefinitions:
      parameters:
        pipelinechannel--approval_metric:
          parameterType: STRING
        pipelinechannel--evaluate-classifier-test_balanced_accuracy:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--minimum_approval_metric:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        pipelinechannel--quality-gate-2-approval_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-condition-4:
    dag:
      outputs:
        artifacts:
          pipelinechannel--quality-gate-3-approval_decision:
            artifactSelectors:
            - outputArtifactKey: approval_decision
              producerSubtask: quality-gate-3
      tasks:
        quality-gate-3:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-quality-gate-3
          inputs:
            parameters:
              metric_name:
                componentInputParameter: pipelinechannel--approval_metric
              metric_value:
                componentInputParameter: pipelinechannel--evaluate-classifier-test_f1_weighted
              minimum_value:
                componentInputParameter: pipelinechannel--minimum_approval_metric
          taskInfo:
            name: quality-gate-3
    inputDefinitions:
      parameters:
        pipelinechannel--approval_metric:
          parameterType: STRING
        pipelinechannel--evaluate-classifier-test_f1_weighted:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--minimum_approval_metric:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        pipelinechannel--quality-gate-3-approval_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-condition-6:
    dag:
      outputs:
        artifacts:
          pipelinechannel--package-manifest-manifest:
            artifactSelectors:
            - outputArtifactKey: manifest
              producerSubtask: package-manifest
      tasks:
        package-manifest:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-package-manifest
          inputs:
            artifacts:
              candidate_model:
                componentInputArtifact: pipelinechannel--train-classifier-candidate_model
              evaluation_metrics:
                componentInputArtifact: pipelinechannel--evaluate-classifier-evaluation_metrics
              training_metrics:
                componentInputArtifact: pipelinechannel--train-classifier-training_metrics
            parameters:
              age_from_year_columns:
                componentInputParameter: pipelinechannel--age_from_year_columns
              date_columns:
                componentInputParameter: pipelinechannel--feature_date_columns
              drop_columns:
                componentInputParameter: pipelinechannel--drop_columns
              keep_date_columns:
                componentInputParameter: pipelinechannel--keep_date_columns
              log_columns:
                componentInputParameter: pipelinechannel--log_columns
              model_filename:
                runtimeValue:
                  constant: startup_classifier.pkl
              ratio_features:
                componentInputParameter: pipelinechannel--ratio_features
              reference_year:
                componentInputParameter: pipelinechannel--reference_year
          taskInfo:
            name: Package approved model manifest
    inputDefinitions:
      artifacts:
        pipelinechannel--evaluate-classifier-evaluation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--train-classifier-candidate_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        pipelinechannel--train-classifier-training_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--age_from_year_columns:
          parameterType: LIST
        pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1:
          parameterType: BOOLEAN
        pipelinechannel--drop_columns:
          parameterType: LIST
        pipelinechannel--feature_date_columns:
          parameterType: LIST
        pipelinechannel--keep_date_columns:
          parameterType: BOOLEAN
        pipelinechannel--log_columns:
          parameterType: LIST
        pipelinechannel--ratio_features:
          parameterType: LIST
        pipelinechannel--reference_year:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        pipelinechannel--package-manifest-manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-condition-7:
    dag:
      outputs:
        artifacts:
          pipelinechannel--package-manifest-2-manifest:
            artifactSelectors:
            - outputArtifactKey: manifest
              producerSubtask: package-manifest-2
      tasks:
        package-manifest-2:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-package-manifest-2
          inputs:
            artifacts:
              candidate_model:
                componentInputArtifact: pipelinechannel--train-classifier-candidate_model
              evaluation_metrics:
                componentInputArtifact: pipelinechannel--evaluate-classifier-evaluation_metrics
              training_metrics:
                componentInputArtifact: pipelinechannel--train-classifier-training_metrics
            parameters:
              age_from_year_columns:
                componentInputParameter: pipelinechannel--age_from_year_columns
              date_columns:
                componentInputParameter: pipelinechannel--feature_date_columns
              drop_columns:
                componentInputParameter: pipelinechannel--drop_columns
              keep_date_columns:
                componentInputParameter: pipelinechannel--keep_date_columns
              log_columns:
                componentInputParameter: pipelinechannel--log_columns
              model_filename:
                runtimeValue:
                  constant: startup_classifier.pkl
              ratio_features:
                componentInputParameter: pipelinechannel--ratio_features
              reference_year:
                componentInputParameter: pipelinechannel--reference_year
          taskInfo:
            name: Package candidate model manifest
    inputDefinitions:
      artifacts:
        pipelinechannel--evaluate-classifier-evaluation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--train-classifier-candidate_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        pipelinechannel--train-classifier-training_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--age_from_year_columns:
          parameterType: LIST
        pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1:
          parameterType: BOOLEAN
        pipelinechannel--drop_columns:
          parameterType: LIST
        pipelinechannel--feature_date_columns:
          parameterType: LIST
        pipelinechannel--keep_date_columns:
          parameterType: BOOLEAN
        pipelinechannel--log_columns:
          parameterType: LIST
        pipelinechannel--ratio_features:
          parameterType: LIST
        pipelinechannel--reference_year:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        pipelinechannel--package-manifest-2-manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-condition-branches-1:
    dag:
      outputs:
        artifacts:
          pipelinechannel--condition-branches-1-oneof-2:
            artifactSelectors:
            - outputArtifactKey: pipelinechannel--quality-gate-approval_decision
              producerSubtask: condition-2
            - outputArtifactKey: pipelinechannel--quality-gate-2-approval_decision
              producerSubtask: condition-3
            - outputArtifactKey: pipelinechannel--quality-gate-3-approval_decision
              producerSubtask: condition-4
      tasks:
        condition-2:
          componentRef:
            name: comp-condition-2
          inputs:
            parameters:
              pipelinechannel--approval_metric:
                componentInputParameter: pipelinechannel--approval_metric
              pipelinechannel--evaluate-classifier-test_accuracy:
                componentInputParameter: pipelinechannel--evaluate-classifier-test_accuracy
              pipelinechannel--minimum_approval_metric:
                componentInputParameter: pipelinechannel--minimum_approval_metric
          taskInfo:
            name: select-accuracy
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--approval_metric']
              == 'accuracy'
        condition-3:
          componentRef:
            name: comp-condition-3
          inputs:
            parameters:
              pipelinechannel--approval_metric:
                componentInputParameter: pipelinechannel--approval_metric
              pipelinechannel--evaluate-classifier-test_balanced_accuracy:
                componentInputParameter: pipelinechannel--evaluate-classifier-test_balanced_accuracy
              pipelinechannel--minimum_approval_metric:
                componentInputParameter: pipelinechannel--minimum_approval_metric
          taskInfo:
            name: select-balanced-accuracy
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--approval_metric'']
              == ''accuracy'') && inputs.parameter_values[''pipelinechannel--approval_metric'']
              == ''balanced_accuracy'''
        condition-4:
          componentRef:
            name: comp-condition-4
          inputs:
            parameters:
              pipelinechannel--approval_metric:
                componentInputParameter: pipelinechannel--approval_metric
              pipelinechannel--evaluate-classifier-test_f1_weighted:
                componentInputParameter: pipelinechannel--evaluate-classifier-test_f1_weighted
              pipelinechannel--minimum_approval_metric:
                componentInputParameter: pipelinechannel--minimum_approval_metric
          taskInfo:
            name: select-weighted-f1
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--approval_metric'']
              == ''accuracy'') && !(inputs.parameter_values[''pipelinechannel--approval_metric'']
              == ''balanced_accuracy'')'
    inputDefinitions:
      parameters:
        pipelinechannel--approval_metric:
          parameterType: STRING
        pipelinechannel--evaluate-classifier-test_accuracy:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--evaluate-classifier-test_balanced_accuracy:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--evaluate-classifier-test_f1_weighted:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--minimum_approval_metric:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        pipelinechannel--condition-branches-1-oneof-2:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-condition-branches-5:
    dag:
      outputs:
        artifacts:
          pipelinechannel--condition-branches-5-oneof-1:
            artifactSelectors:
            - outputArtifactKey: pipelinechannel--package-manifest-manifest
              producerSubtask: condition-6
            - outputArtifactKey: pipelinechannel--package-manifest-2-manifest
              producerSubtask: condition-7
      tasks:
        condition-6:
          componentRef:
            name: comp-condition-6
          inputs:
            artifacts:
              pipelinechannel--evaluate-classifier-evaluation_metrics:
                componentInputArtifact: pipelinechannel--evaluate-classifier-evaluation_metrics
              pipelinechannel--train-classifier-candidate_model:
                componentInputArtifact: pipelinechannel--train-classifier-candidate_model
              pipelinechannel--train-classifier-training_metrics:
                componentInputArtifact: pipelinechannel--train-classifier-training_metrics
            parameters:
              pipelinechannel--age_from_year_columns:
                componentInputParameter: pipelinechannel--age_from_year_columns
              pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1:
                componentInputParameter: pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1
              pipelinechannel--drop_columns:
                componentInputParameter: pipelinechannel--drop_columns
              pipelinechannel--feature_date_columns:
                componentInputParameter: pipelinechannel--feature_date_columns
              pipelinechannel--keep_date_columns:
                componentInputParameter: pipelinechannel--keep_date_columns
              pipelinechannel--log_columns:
                componentInputParameter: pipelinechannel--log_columns
              pipelinechannel--ratio_features:
                componentInputParameter: pipelinechannel--ratio_features
              pipelinechannel--reference_year:
                componentInputParameter: pipelinechannel--reference_year
          taskInfo:
            name: approved-model
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1']
              == true
        condition-7:
          componentRef:
            name: comp-condition-7
          inputs:
            artifacts:
              pipelinechannel--evaluate-classifier-evaluation_metrics:
                componentInputArtifact: pipelinechannel--evaluate-classifier-evaluation_metrics
              pipelinechannel--train-classifier-candidate_model:
                componentInputArtifact: pipelinechannel--train-classifier-candidate_model
              pipelinechannel--train-classifier-training_metrics:
                componentInputArtifact: pipelinechannel--train-classifier-training_metrics
            parameters:
              pipelinechannel--age_from_year_columns:
                componentInputParameter: pipelinechannel--age_from_year_columns
              pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1:
                componentInputParameter: pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1
              pipelinechannel--drop_columns:
                componentInputParameter: pipelinechannel--drop_columns
              pipelinechannel--feature_date_columns:
                componentInputParameter: pipelinechannel--feature_date_columns
              pipelinechannel--keep_date_columns:
                componentInputParameter: pipelinechannel--keep_date_columns
              pipelinechannel--log_columns:
                componentInputParameter: pipelinechannel--log_columns
              pipelinechannel--ratio_features:
                componentInputParameter: pipelinechannel--ratio_features
              pipelinechannel--reference_year:
                componentInputParameter: pipelinechannel--reference_year
          taskInfo:
            name: rejected-model
          triggerPolicy:
            condition: '!(inputs.parameter_values[''pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1'']
              == true)'
    inputDefinitions:
      artifacts:
        pipelinechannel--evaluate-classifier-evaluation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--train-classifier-candidate_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        pipelinechannel--train-classifier-training_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--age_from_year_columns:
          parameterType: LIST
        pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1:
          parameterType: BOOLEAN
        pipelinechannel--drop_columns:
          parameterType: LIST
        pipelinechannel--feature_date_columns:
          parameterType: LIST
        pipelinechannel--keep_date_columns:
          parameterType: BOOLEAN
        pipelinechannel--log_columns:
          parameterType: LIST
        pipelinechannel--ratio_features:
          parameterType: LIST
        pipelinechannel--reference_year:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        pipelinechannel--condition-branches-5-oneof-1:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-evaluate-classifier:
    executorLabel: exec-evaluate-classifier
    inputDefinitions:
      artifacts:
        candidate_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        data_format:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        evaluation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        test_accuracy:
          parameterType: NUMBER_DOUBLE
        test_balanced_accuracy:
          parameterType: NUMBER_DOUBLE
        test_f1_weighted:
          parameterType: NUMBER_DOUBLE
  comp-importer:
    executorLabel: exec-importer
    inputDefinitions:
      parameters:
        uri:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        artifact:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-package-manifest:
    executorLabel: exec-package-manifest
    inputDefinitions:
      artifacts:
        candidate_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        evaluation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        training_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        age_from_year_columns:
          parameterType: LIST
        date_columns:
          parameterType: LIST
        drop_columns:
          parameterType: LIST
        keep_date_columns:
          parameterType: BOOLEAN
        log_columns:
          parameterType: LIST
        model_filename:
          parameterType: STRING
        ratio_features:
          parameterType: LIST
        reference_year:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-package-manifest-2:
    executorLabel: exec-package-manifest-2
    inputDefinitions:
      artifacts:
        candidate_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        evaluation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        training_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        age_from_year_columns:
          parameterType: LIST
        date_columns:
          parameterType: LIST
        drop_columns:
          parameterType: LIST
        keep_date_columns:
          parameterType: BOOLEAN
        log_columns:
          parameterType: LIST
        model_filename:
          parameterType: STRING
        ratio_features:
          parameterType: LIST
        reference_year:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-quality-gate:
    executorLabel: exec-quality-gate
    inputDefinitions:
      parameters:
        metric_name:
          parameterType: STRING
        metric_value:
          parameterType: NUMBER_DOUBLE
        minimum_value:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        approval_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        passed:
          parameterType: BOOLEAN
  comp-quality-gate-2:
    executorLabel: exec-quality-gate-2
    inputDefinitions:
      parameters:
        metric_name:
          parameterType: STRING
        metric_value:
          parameterType: NUMBER_DOUBLE
        minimum_value:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        approval_decision:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        passed:
          parameterType: BOOLEAN
  comp-quality-gate-3:
    executorLabel: exec-quality-gate-3
    inputDefinitions:
      parameters:
        metric_name:
          parameterType: STRING
        metric_value:
          parameterType: NUMBER_DOUBLE
        minimum_value:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        approval_decision:
