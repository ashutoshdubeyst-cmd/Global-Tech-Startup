pipelineInfo:
  description: Validate, clean, feature engineer, train, evaluate, and quality gate
    the startup acquisition classifier.
  name: startup-acquisition-training
root:
  dag:
    outputs:
      artifacts:
        approval_decision:
          artifactSelectors:
          - outputArtifactKey: pipelinechannel--condition-branches-1-oneof-2
            producerSubtask: condition-branches-1
        candidate_model:
          artifactSelectors:
          - outputArtifactKey: candidate_model
            producerSubtask: train-classifier
        evaluation_metrics:
          artifactSelectors:
          - outputArtifactKey: evaluation_metrics
            producerSubtask: evaluate-classifier
        manifest:
          artifactSelectors:
          - outputArtifactKey: pipelinechannel--condition-branches-5-oneof-1
            producerSubtask: condition-branches-5
    tasks:
      build-feature-splits:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-build-feature-splits
        dependentTasks:
        - clean-dataset
        - validate-dataset-2
        inputs:
          artifacts:
            cleaned_dataset:
              taskOutputArtifact:
                outputArtifactKey: cleaned_dataset
                producerTask: clean-dataset
          parameters:
            age_from_year_columns:
              componentInputParameter: age_from_year_columns
            date_columns:
              componentInputParameter: feature_date_columns
            drop_columns:
              componentInputParameter: drop_columns
            input_format:
              componentInputParameter: output_format
            keep_date_columns:
              componentInputParameter: keep_date_columns
            log_columns:
              componentInputParameter: log_columns
            output_format:
              componentInputParameter: output_format
            random_state:
              componentInputParameter: random_state
            ratio_features:
              componentInputParameter: ratio_features
            reference_year:
              componentInputParameter: reference_year
            stratify:
              componentInputParameter: stratify
            target_column:
              componentInputParameter: target_column
            test_fraction:
              componentInputParameter: test_fraction
            train_fraction:
              componentInputParameter: train_fraction
            validation_fraction:
              componentInputParameter: validation_fraction
        taskInfo:
          name: Build and split model features
      clean-dataset:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-clean-dataset
        dependentTasks:
        - importer
        - validate-dataset
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer
          parameters:
            date_columns:
              componentInputParameter: cleaning_date_columns
            drop_duplicate_rows:
              componentInputParameter: drop_duplicate_rows
            drop_empty_rows:
              componentInputParameter: drop_empty_rows
            input_format:
              componentInputParameter: source_format
            missing_markers:
              componentInputParameter: missing_markers
            numeric_columns:
              componentInputParameter: numeric_columns
            output_format:
              componentInputParameter: output_format
        taskInfo:
          name: Clean startup data
      condition-branches-1:
        componentRef:
          name: comp-condition-branches-1
        dependentTasks:
        - evaluate-classifier
        inputs:
          parameters:
            pipelinechannel--approval_metric:
              componentInputParameter: approval_metric
            pipelinechannel--evaluate-classifier-test_accuracy:
              taskOutputParameter:
                outputParameterKey: test_accuracy
                producerTask: evaluate-classifier
            pipelinechannel--evaluate-classifier-test_balanced_accuracy:
              taskOutputParameter:
                outputParameterKey: test_balanced_accuracy
                producerTask: evaluate-classifier
            pipelinechannel--evaluate-classifier-test_f1_weighted:
              taskOutputParameter:
                outputParameterKey: test_f1_weighted
                producerTask: evaluate-classifier
            pipelinechannel--minimum_approval_metric:
              componentInputParameter: minimum_approval_metric
        taskInfo:
          name: condition-branches-1
      condition-branches-5:
        componentRef:
          name: comp-condition-branches-5
        dependentTasks:
        - condition-branches-1
        - evaluate-classifier
        - train-classifier
        inputs:
          artifacts:
            pipelinechannel--evaluate-classifier-evaluation_metrics:
              taskOutputArtifact:
                outputArtifactKey: evaluation_metrics
                producerTask: evaluate-classifier
            pipelinechannel--train-classifier-candidate_model:
              taskOutputArtifact:
                outputArtifactKey: candidate_model
                producerTask: train-classifier
            pipelinechannel--train-classifier-training_metrics:
              taskOutputArtifact:
                outputArtifactKey: training_metrics
                producerTask: train-classifier
          parameters:
            pipelinechannel--age_from_year_columns:
              componentInputParameter: age_from_year_columns
            pipelinechannel--condition-branches-1-pipelinechannel--condition-branches-1-oneof-1:
              taskOutputParameter:
                outputParameterKey: pipelinechannel--condition-branches-1-oneof-1
                producerTask: condition-branches-1
            pipelinechannel--drop_columns:
              componentInputParameter: drop_columns
            pipelinechannel--feature_date_columns:
              componentInputParameter: feature_date_columns
            pipelinechannel--keep_date_columns:
              componentInputParameter: keep_date_columns
            pipelinechannel--log_columns:
              componentInputParameter: log_columns
            pipelinechannel--ratio_features:
              componentInputParameter: ratio_features
            pipelinechannel--reference_year:
              componentInputParameter: reference_year
        taskInfo:
          name: condition-branches-5
      evaluate-classifier:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-classifier
        dependentTasks:
        - build-feature-splits
        - train-classifier
        inputs:
          artifacts:
            candidate_model:
              taskOutputArtifact:
                outputArtifactKey: candidate_model
                producerTask: train-classifier
            test_dataset:
              taskOutputArtifact:
                outputArtifactKey: test_dataset
                producerTask: build-feature-splits
          parameters:
            data_format:
              componentInputParameter: output_format
        taskInfo:
          name: Evaluate held-out test data
      importer:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-importer
        inputs:
          parameters:
            uri:
              componentInputParameter: source_dataset_uri
        taskInfo:
          name: Import source startup dataset
      train-classifier:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-classifier
        dependentTasks:
        - build-feature-splits
        inputs:
          artifacts:
            train_dataset:
              taskOutputArtifact:
                outputArtifactKey: train_dataset
                producerTask: build-feature-splits
            validation_dataset:
              taskOutputArtifact:
                outputArtifactKey: validation_dataset
                producerTask: build-feature-splits
          parameters:
            class_weight:
              componentInputParameter: class_weight
            data_format:
              componentInputParameter: output_format
            max_iter:
              componentInputParameter: max_iter
            model_type:
              componentInputParameter: model_type
            n_estimators:
              componentInputParameter: n_estimators
            random_state:
              componentInputParameter: random_state
            target_column:
              componentInputParameter: target_column
        taskInfo:
          name: Train startup classifier
      validate-dataset:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-dataset
        dependentTasks:
        - importer
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer
          parameters:
            allowed_target_values:
              componentInputParameter: allowed_target_values
            fail_on_duplicate_rows:
              componentInputParameter: fail_on_duplicate_rows
            input_format:
              componentInputParameter: source_format
            max_missing_fraction:
              componentInputParameter: max_missing_fraction
            required_columns:
              componentInputParameter: required_columns
            target_column:
              componentInputParameter: target_column
        taskInfo:
          name: Validate raw startup data
      validate-dataset-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-dataset-2
        dependentTasks:
        - clean-dataset
        inputs:
          artifacts:
            input_dataset:
              taskOutputArtifact:
                outputArtifactKey: cleaned_dataset
                producerTask: clean-dataset
          parameters:
            allowed_target_values:
              componentInputParameter: allowed_target_values
            fail_on_duplicate_rows:
              runtimeValue:
                constant: true
            input_format:
              componentInputParameter: output_format
            max_missing_fraction:
              componentInputParameter: max_missing_fraction
            required_columns:
              componentInputParameter: required_columns
            target_column:
              componentInputParameter: target_column
        taskInfo:
          name: Validate cleaned startup data
  inputDefinitions:
    parameters:
      age_from_year_columns:
        defaultValue:
        - founding_year
        isOptional: true
        parameterType: LIST
      allowed_target_values:
        defaultValue:
        - Acquired
        - Independent
        isOptional: true
        parameterType: LIST
      approval_metric:
        defaultValue: f1_weighted
        isOptional: true
        parameterType: STRING
      class_weight:
        defaultValue: balanced
        isOptional: true
        parameterType: STRING
      cleaning_date_columns:
        defaultValue: []
        isOptional: true
        parameterType: LIST
      drop_columns:
        defaultValue:
        - company_id
        isOptional: true
        parameterType: LIST
      drop_duplicate_rows:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      drop_empty_rows:
        defaultValue: true
